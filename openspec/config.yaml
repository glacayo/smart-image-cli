schema: spec-driven

context: |
  Project: smart-image-cli (img-ia-analyzer-resizer) — agent-friendly CLI, published as `img`
  Stack: Node >=22, TypeScript 5.7 (ESM), Commander, Zod, Sharp, better-sqlite3, exiftool-vendored
  Architecture: layered CLI — src/cli (commands/output), src/app (services/runtime), src/adapters (vision/db/fs), src/domain, src/config
  Testing: vitest (unit/integration/e2e dirs under test/), eslint (flat config) + typescript-eslint, prettier, tsc --noEmit
  Style: strict Zod schemas at config boundaries, typed provider error taxonomy, secret redaction on project config

strict_tdd: true
tdd_reason: vitest runner detected with existing unit/integration/e2e coverage; strict TDD enabled

testing:
  detected: 2026-07-29
  runner: vitest (vitest run)
  layers:
    unit: available (test/domain, test/app, test/adapters, test/config)
    integration: available (test/integration, test/commands)
    e2e: available (test/e2e)
  coverage:
    available: false
    command: ""
  quality:
    linter: available (eslint . — eslint.config.js, typescript-eslint)
    type_checker: available (tsc --noEmit)
    formatter: available (prettier --check)

rules:
  proposal:
    - Include rollback plan for risky changes
    - State target language/runtime explicitly; stack choice is a proposal-level decision
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document architecture decisions with rationale
    - Include sequence diagrams for complex flows (AI analysis, index read/write, section selection)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas